name: Release validation

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Automated artifact, skill, and unit validation
        # This intentionally does not download the managed toolchain or claim browser coverage.
        run: npm run check
      - name: Manual release canary reminder
        run: |
          echo "Automated checks complete. Before publishing, run the CachyOS canary from docs/TESTING.md:"
          echo "  ./bin/bootstrap && ./bin/codex-setup install && npm run test:browser"
          echo "The canary must be recorded separately; this workflow does not run it."
      - name: Verify tag is annotated and version-aligned
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${GITHUB_REF_NAME}^{tag}"
          node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
